<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="256" cy="256" r="236" />
    </clipPath>
  </defs>
  <!-- Base Outer Glow / Dark Theme Canvas -->
  <circle cx="256" cy="256" r="256" fill="#0b0f19" />
  
  <!-- Embedded Prof. Joe Avatar Image -->
  <image href="/joe-avatar.png" x="20" y="20" width="472" height="472" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)" />
  
  <!-- Vibrant Cyan Neon Outer Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#06b6d4" stroke-width="18" />
  <circle cx="256" cy="256" r="248" fill="none" stroke="rgba(6, 182, 212, 0.4)" stroke-width="6" />
</svg>